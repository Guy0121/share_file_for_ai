name: Import shared noh videos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import_noh_videos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Import, combine and split into five videos
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib, urllib.request, subprocess, concurrent.futures
          sources = json.loads("[{\"name\":\"male2\",\"url\":\"https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-87cc-81fa-a8f3-6feaaded9cf5/raw?se=2026-11-07T09%3A39%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=607eb268-cef0-4b65-871d-eb27ace96b35&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T02%3A59%3A27Z&ske=2026-11-08T02%3A59%3A27Z&sks=b&skv=2026-02-06&sig=Q9SAsRXHiZNh8k5OSQ9psi%2BmAGKD8ljD9awWHwFoXko%3D\",\"sha256\":\"95ec35d332f43655f316c08e97b525ecf210d20b1f474af9c43acd977ece0905\",\"duration\":33.083333},{\"name\":\"female2\",\"url\":\"https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-b650-81fa-ac29-20dcc4d89b3c/raw?se=2026-11-07T09%3A39%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=607eb268-cef0-4b65-871d-eb27ace96b35&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T08%3A50%3A31Z&ske=2026-11-08T08%3A50%3A31Z&sks=b&skv=2026-02-06&sig=QcO1bowyGdLRCLYTtkW2t8UshHcWpOY7swpLaacifqw%3D\",\"sha256\":\"819075641b83976c9603439b7603131b07be622dbfb9398ace4a4193f0f63428\",\"duration\":124.334},{\"name\":\"okina\",\"url\":\"https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-bf70-81fa-b464-9a122038014e/raw?se=2026-11-07T09%3A39%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=607eb268-cef0-4b65-871d-eb27ace96b35&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T22%3A58%3A42Z&ske=2026-11-07T22%3A58%3A42Z&sks=b&skv=2026-02-06&sig=ZUChxm/lZzlLa4vTMHqMRkY5HbG70yxebRbT0EC6fBk%3D\",\"sha256\":\"f964e4d398061f6bc0baa51f73ca711551b4e829d3a75297d9879d645f839641\",\"duration\":16.392},{\"name\":\"kami\",\"url\":\"https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-fa40-81fa-94de-4679854c8535/raw?se=2026-11-07T09%3A39%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=607eb268-cef0-4b65-871d-eb27ace96b35&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T23%3A04%3A52Z&ske=2026-11-07T23%3A04%3A52Z&sks=b&skv=2026-02-06&sig=kzRrIBGzQhT1ciUo%2BIAysNpoUTAsiVfdZDv33FyI%2B5I%3D\",\"sha256\":\"862f59e65d51b0a53df58e5df846a71cc728cd54f89c3769243d549cf36604d2\",\"duration\":21.533333},{\"name\":\"animal\",\"url\":\"https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-eaac-81fa-b057-212bf5168d82/raw?se=2026-11-07T09%3A39%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=607eb268-cef0-4b65-871d-eb27ace96b35&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-06T22%3A56%3A06Z&ske=2026-11-07T22%3A56%3A06Z&sks=b&skv=2026-02-06&sig=gRVE%2B2511zENWPX4eA1bUfCwSq%2BredmartK6odwwq%2B4%3D\",\"sha256\":\"b8de5fa66df28b43b9e0ed87e2b4c85f06c0f4cf493090f826813ffcd0d961f7\",\"duration\":16.367}]")
          tmp=pathlib.Path('/tmp/noh_sources');tmp.mkdir(exist_ok=True)
          out=pathlib.Path('noh_videos_20261107');out.mkdir(exist_ok=True)
          def download(item):
              p=tmp/(item['name']+'.mp4')
              urllib.request.urlretrieve(item['url'], p)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
              return p
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool: paths=list(pool.map(download,sources))
          filters=[];inputs=[]
          for i,(p,item) in enumerate(zip(paths,sources)):
              inputs+=['-i',str(p)]
              filters += [f'[{i}:v:0]setpts=PTS-STARTPTS,scale=1080:1920:force_original_aspect_ratio=decrease:force_divisible_by=2:flags=lanczos,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:black,setsar=1,fps=30,format=yuv420p[v{i}]', f'[{i}:a:0]asetpts=PTS-STARTPTS,aresample=48000,apad,atrim=duration={item["duration"]},aformat=sample_fmts=fltp:sample_rates=48000:channel_layouts=stereo[a{i}]']
          filters+=[''.join(f'[v{i}][a{i}]' for i in range(5))+'concat=n=5:v=1:a=1[v][a]']
          subprocess.run(['ffmpeg','-y','-hide_banner','-loglevel','error','-filter_complex_threads','2',*inputs,'-filter_complex',';'.join(filters),'-map','[v]','-map','[a]','-c:v','libx264','-preset','veryfast','-crf','18','-maxrate','4500k','-bufsize','9000k','-threads','2','-c:a','aac','-b:a','160k','-force_key_frames','expr:gte(t,n_forced*42.4)','-f','segment','-segment_time','42.4','-segment_start_number','1','-reset_timestamps','1','-segment_format','mp4','-segment_format_options','movflags=+faststart',str(out/'part_%02d.mp4')],check=True)
          parts=sorted(out.glob('part_*.mp4'))
          assert len(parts)==5, len(parts)
          rows=[];checks=[]
          for p in parts:
              assert 0<p.stat().st_size<30_000_000, (str(p),p.stat().st_size)
              d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(p)]))
              assert any(s['codec_type']=='audio' for s in d['streams'])
              rows.append(f'| [{p.name}](./{p.name}) | {p.stat().st_size/1e6:.2f} MB | {float(d["format"]["duration"]):.2f}秒 |')
              checks.append(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name)
          (out/'SHA256SUMS.txt').write_text('\n'.join(checks)+'\n')
          (out/'concat.txt').write_text(''.join(f"file '{p.name}'\n" for p in parts))
          (out/'README.md').write_text('# 能面動画・共有用\n\n男2 → 女2 → 翁 → 神 → 動物 の順に結合した、約3分32秒の音声付き動画です。\n\n1080×1920 / H.264 / AAC。元の縦横比は余白で保持しています。全編を連続した5本の動画に分割しており、各30 MB未満です。\n\n| ファイル | 容量 | 長さ |\n|---|---:|---:|\n'+'\n'.join(rows)+'\n\n## 他のAIへの引き継ぎ\n\nこのフォルダー内の part_01.mp4 〜 part_05.mp4 をすべて取得し、番号順に参照してください。各ファイルは単独再生できます。\n\n## 1本に戻す\n\nこのフォルダー内で以下を実行してください。\n\n```bash\nffmpeg -f concat -safe 0 -i concat.txt -c copy -movflags +faststart noh_combined.mp4\n```\n\nSHA256SUMS.txt に各ファイルの検証用ハッシュがあります。\n')
          print('Prepared five videos, all below 30 MB')
          
          PY
      - name: Commit shared videos and remove one-time importer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add noh_videos_20261107
          git rm .github/workflows/import_noh_videos.yml
          git commit -m 'Add five shared noh video parts under 30 MB each'
          git push
